[pytest]
# Configuration pytest pour MLX-OlmOCR API Server

# Répertoires de tests
testpaths = test

# Options par défaut
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

# Markers personnalisés
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    e2e: Tests end-to-end
    slow: Tests lents (décorez avec @pytest.mark.slow)

# Patterns de découverte des tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options de verbosité
console_output_style = progress
